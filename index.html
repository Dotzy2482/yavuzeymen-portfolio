<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0b0d" />
    <meta
      name="description"
      content="Yavuz Eymen — sim racing driver. Track records, career and content."
    />

    <!--
      Placeholder mark, see public/favicon.svg. Declaring an icon explicitly is
      also what stops the browser probing /favicon.ico and taking a 404.

      apple-touch-icon has to be a PNG — iOS will not take the SVG — so it is
      rasterised from the same favicon.svg by
      docs/assets/generate-og-images.mjs. No `sizes`: with a single icon
      declared, iOS scales it for every slot it needs.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Social preview. The card is composed in docs/assets/og-card.html and
      rasterised by docs/assets/generate-og-images.mjs — edit the source and
      regenerate, never the PNG.

      og:image is root-relative because there is no final domain to make it
      absolute with. Crawlers generally resolve it against the page URL, but
      Facebook's own documentation asks for an absolute URL, so treat this as
      provisional: it must become absolute at the same moment og:url and a
      canonical link arrive — which is the same wait, for the same reason.

      NOTE: og:description and the `description` meta above are English inside
      a lang="tr" document with og:locale tr_TR. That is a copy decision, not a
      bug to fix in passing — see docs/CONTENT.md.
    -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Yavuz Eymen" />
    <meta property="og:title" content="Yavuz Eymen — Sim Racing" />
    <meta
      property="og:description"
      content="Yavuz Eymen — sim racing driver. Track records, career and content."
    />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Yavuz Eymen — professional sim racing driver and content creator, Team Curve Hunters."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yavuz Eymen — Sim Racing" />
    <meta
      name="twitter:description"
      content="Yavuz Eymen — sim racing driver. Track records, career and content."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Yavuz Eymen — professional sim racing driver and content creator, Team Curve Hunters."
    />

    <!--
      PIT WALL type direction: Archivo variable (wdth 62–125, wght 100–900),
      Instrument Serif italic accent, Martian Mono for numerics/labels.
      Self-hosted — the @font-face rules are in src/styles/fonts.css.

      Preloaded: the `latin` file of each, because all three are on screen in
      the hero at first paint — the headline, its serif accent, the mono labels
      — and a font the browser only discovers after parsing the stylesheet
      costs a round trip it did not need to wait for. The `latin-ext` files
      carry the Turkish ş ğ İ, which the hero never shows, so they are left to
      load when the copy further down asks for them. `crossorigin` is required
      even same-origin: fonts are fetched in CORS mode, and a preload without
      it is fetched twice.
    -->
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/instrument-serif-italic-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/martian-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Yavuz Eymen — Sim Racing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
