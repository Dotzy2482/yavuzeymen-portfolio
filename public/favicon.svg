<svg xmlns="http://www.w3.org/2000/svg" viewBox="250 250 1500 1500" role="img" aria-label="Yavuz Eymen">
  <!--
    Yavuz's YE monogram on the page ground — the same three polygons as
    src/components/ui/LogoMark.tsx, in the supplied artwork's 2000 × 2000
    coordinates. Change both together.

    The colours are literals because a favicon is a standalone document: it
    cannot see the page's CSS. They mirror --bg (#0a0b0d), --brand-navy
    (#121a49) and --brand-purple (#7d36fe) in styles/tokens.css.

    public/apple-touch-icon.png is rasterised from this file by
    docs/assets/generate-og-images.mjs.
  -->
  <rect x="250" y="250" width="1500" height="1500" rx="270" fill="#0a0b0d" />
  <polygon
    fill="#121a49"
    points="1158,578 1647,721 1635,767 1233,767 1117,1232 1557,1232 1510,1421 441,1421 520,1104 319,578 561,578 677,887 911,578"
  />
  <polygon
    fill="#7d36fe"
    points="1158,578 1680,578 1646,721 1181,721 905,1080 819,1421 673,1421 751,1101"
  />
  <polygon fill="#7d36fe" points="1091,908 1564,908 1523,1080 957,1080" />
</svg>
