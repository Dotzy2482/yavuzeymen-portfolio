<svg xmlns="http://www.w3.org/2000/svg" viewBox="108 200 1600 1600" role="img" aria-label="Yavuz Eymen">
  <!--
    Yavuz's YE monogram on the page ground — the same three polygons as
    src/components/ui/LogoMark.tsx. Change both together.

    The colours are literals because a favicon is a standalone document: it
    cannot see the page's CSS. They mirror the bg (#0a0b0d), brand-navy
    (#1b2175) and brand-purple (#952cff) tokens in styles/tokens.css. (No
    double hyphens in this comment: XML forbids them, and a favicon is parsed
    as XML, so one would break the icon.)

    public/apple-touch-icon.png is rasterised from this file by
    docs/assets/generate-og-images.mjs.
  -->
  <rect x="108" y="200" width="1600" height="1600" rx="290" fill="#0a0b0d" />
  <polygon fill="#1b2175" points="1055,578 1600,721 1600,767 1176,767 1176,1232 1600,1232 1600,1421 545,1421 545,1104 216,578 458,578 649,887 808,578" />
  <polygon fill="#952cff" points="1055,578 1600,578 1600,721 1113,721 924,1080 924,1421 776,1421 776,1101" />
  <polygon fill="#952cff" points="1068,908 1545,908 1545,1080 977,1080" />
</svg>
