name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a run be started by hand for a given ref. Without it there is no way
  # to get a result for a commit whose automatic run never reported.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a pull request push is worth cancelling; a commit on the default
  # branch is not. Cancelling those means a merge can land with no CI result at
  # all, and the history of what main was verified at develops holes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # On a pull_request event gitleaks-action lists the PR's commits so it can
    # scan just the new range, which needs pull-requests: read. Without it the
    # action takes a 403 from the API and exits non-zero — a red check that says
    # nothing about whether the diff contains a secret.
    #
    # Job-level permissions replace the workflow-level block rather than adding
    # to it, so contents: read is restated here on purpose.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          # gitleaks must see every commit, not just the tip — a secret that was
          # committed and later removed is still in the history.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
